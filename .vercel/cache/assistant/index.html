<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Responder 2.0</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;,">
</head>
<body>
  <div class="main-content">
    <div class="header">
      <img src="firstresponder-logo.png" alt="First Responder" class="logo">
      <h1>Ask Dave</h1>
      <p class="tagline">Answer RFIs in a flash</p>
    </div>
    <div class="quick-actions">
      <button class="action-btn" data-query="Tell me about DHC's brand voice">BRAND VOICE</button>
      <button class="action-btn" data-query="What are DHC's current marketing priorities?">MARKETING</button>
      <button class="action-btn" data-query="How do we maintain street cred while scaling?">CULTURE</button>
      <button class="action-btn" data-query="What makes DHC's chicken special?">PRODUCT</button>
    </div>
    <div class="chat-container">
      <div id="chat-log"></div>
      <div class="input-area">
        <input type="text" id="user-input" placeholder="Enter your message...">
        <button id="send-btn">
          Send
        </button>
      </div>
    </div>
  </div>
  <script>
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');
    const chatLog = document.getElementById('chat-log');
    
    // Add quick action button functionality
    document.querySelectorAll('.action-btn').forEach(button => {
      button.addEventListener('click', () => {
        const query = button.getAttribute('data-query');
        userInput.value = query;
        sendMessage();
      });
    });

    async function sendMessage() {
        const message = userInput.value;
        if (!message) return;
        
        // Get button elements
        const sendBtn = document.getElementById('send-btn');
        
        // Show user message
        addMessage(message, 'user');
        userInput.value = '';
        
        // Show loading state
        sendBtn.disabled = true;
        let dots = 0;
        const loadingInterval = setInterval(() => {
            // Pad with spaces to match "Send" length
            sendBtn.textContent = '.'.repeat(dots + 1).padEnd(4);
            dots = (dots + 1) % 3;
        }, 500);
        
        console.log("Sending message:", message);
        
        try {
            const response = await fetch('/api/assistant', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({message})
            });
            
            let errorMessage = 'Fuck. A server error has occurred';
            
            // Try to get response body even for errors
            const data = await response.json().catch(e => {
                console.error('Failed to parse response:', e);
                return { error: { message: 'Invalid server response' } };
            });
            
            if (!response.ok) {
                errorMessage = data.error?.message || errorMessage;
                console.error('Server error details:', data.error);
                throw new Error(errorMessage);
            }
            
            if (data.error) {
                errorMessage = data.error?.message || 'Unknown error';
                console.error('Response error details:', data.error);
                throw new Error(errorMessage);
            }
            
            console.log("Received response:", data.response);
            
            addMessage(data.response, 'bot');
        } catch (error) {
            console.error('Error details:', error);
            // Log the full error stack for debugging
            console.error('Error stack:', error.stack);
            addMessage(`Sorry, I encountered an error. Please try again in a moment.`, 'bot');
        } finally {
            // Reset button state
            clearInterval(loadingInterval);
            sendBtn.disabled = false;
            sendBtn.textContent = "Send";
        }
    }

    function addMessage(text, sender) {
        console.log("Adding message:", text, "Sender:", sender);
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        
        const name = sender === 'bot' ? 'Assistant' : 'You';
        const nameClass = sender === 'bot' ? 'assistant-name' : 'user-name';
        
        // Format the message BEFORE adding it to the DOM
        const formattedText = formatMessage(text);
        console.log("Formatted result:", formattedText);
        
        // Use the formatted text in the innerHTML
        messageDiv.innerHTML = `<strong class="${nameClass}">${name}:</strong> ${formattedText}`;
        
        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function formatMessage(text) {
        if (!text) return '';
        
        // Log the incoming text for debugging
        console.log("Formatting text:", text);
        
        // First escape any HTML characters to prevent injection
        let formatted = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        
        // CONVERT BOLD - this is the critical part
        // Handle various patterns of bold text
        formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        
        // Process email addresses with markdown
        formatted = formatted.replace(/\[([^\]]+)\]\((mailto:[^)]+)\)/g, 
            '<a href="$2">$1</a>');
        
        // Process numbered lists
        let lines = formatted.split('\n');
        let inList = false;
        let listHTML = '<ol>';
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const listMatch = line.match(/^(\d+)\.\s+(.*)/);
            
            if (listMatch) {
                if (!inList) {
                    lines[i] = listHTML;
                    inList = true;
                } else {
                    lines[i] = '';
                }
                
                // Extract the text after the number and period
                const listItemText = listMatch[2];
                
                // Process any bold text within the list item
                const processedText = listItemText.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
                
                listHTML += `<li>${processedText}</li>`;
            } else if (inList && (line.trim() === '' || i === lines.length - 1)) {
                lines[i] = '</ol>' + line;
                inList = false;
                listHTML = '<ol>';
            }
        }
        
        if (inList) {
            lines.push('</ol>');
        }
        
        formatted = lines.join('\n');
        
        // Convert plain URLs to clickable links
        formatted = formatted.replace(/(https?:\/\/[^\s<]+)/g, 
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        
        // Convert line breaks to <br> tags (but not in lists)
        formatted = formatted.replace(/\n(?!<\/?[uo]l>|<\/?li>)/g, '<br>');
        
        console.log("Formatted output:", formatted);
        return formatted;
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Add initial welcome message
    window.addEventListener('load', () => {
        addMessage("Hello Noble Person", 'bot');
    });
  </script>
</body>
</html>
